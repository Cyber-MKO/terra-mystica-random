# Deploys the static site to GitHub Pages on every push to the default branch.
#
# One-time setup: in the repository settings, under Pages, set
# "Source" to "GitHub Actions". After that this workflow publishes the site
# at https://<user>.github.io/<repo>/ automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # the whole repo is the static site; no build step
      - id: deployment
        uses: actions/deploy-pages@v4
